services:
  - type: web
    name: pakka-khata
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: ollama
      - key: BASE_URL
        value: http://localhost:11434
      - key: MODEL_NAME
        value: gemma3:4b
      - key: DEMO_MODE
        value: "true"
      - key: RATE_LIMIT_PER_HOUR
        value: "20"
      - key: REQUEST_TIMEOUT_S
        value: "120"
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: APP_ENV
        value: production
      - key: API_KEY
        sync: false
